<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Content Admin — Abdulla Al Noman</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Netlify Identity widget: powers the login button below -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS (formerly Netlify CMS) — reads admin/config.yml and edits content.json -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Redirect Netlify Identity confirmation links back to this admin page
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
